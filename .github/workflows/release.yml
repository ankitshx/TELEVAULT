name: Release Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          python -m PyInstaller packaging/televault.spec --clean --noconfirm

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/televault.exe -DestinationPath dist/TeleVault-Windows-x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: TeleVault ${{ github.ref_name }} — Desktop Application
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/televault.exe
            dist/TeleVault-Windows-x64.zip
