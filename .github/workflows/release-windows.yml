name: TELEVAULT Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package, and Release Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/desktop/package-lock.json"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Inno Setup Compiler
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress -y
            echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Python Test Suite
        run: |
          pytest tests/ -v

      - name: Build Standalone Backend (PyInstaller)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -Mode Production -SkipTests

      - name: Run Workspace Tests
        shell: pwsh
        run: |
          cargo test --workspace

      - name: Build Standalone Executable (Tauri)
        shell: pwsh
        run: |
          cd apps/desktop
          npm ci
          npx tauri build --no-bundle
          cd ../..
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/TELEVAULT.exe dist/TELEVAULT.exe -Force

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_installer.ps1

      - name: Verify Release & Compute SHA-256 Checksums
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify_release.ps1 -SkipSmokeTest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: TELEVAULT ${{ github.ref_name || 'v2.1.4' }} — Windows Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/TELEVAULT-Setup-x64.exe
            release/TELEVAULT-Portable-x64.exe
            release/TELEVAULT.exe
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.txt

