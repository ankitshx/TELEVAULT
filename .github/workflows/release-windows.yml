name: TELEVAULT Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, and Release Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Test Suite Validation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v

      - name: Build React Desktop Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build Rust Desktop Executable (Tauri)
        shell: pwsh
        run: |
          cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/TELEVAULT.exe dist/TELEVAULT.exe -Force

      - name: Verify Release & Compute SHA-256 Checksums
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify_release.ps1 -SkipSmokeTest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: TELEVAULT ${{ github.ref_name || 'v2.1.3' }} — Windows Direct-Run
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/TELEVAULT.exe
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.txt
