name: TELEVAULT Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, and Release Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/desktop/package-lock.json"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Standalone Executable (Tauri)
        shell: pwsh
        run: |
          cd apps/desktop
          npm ci
          npx tauri build --no-bundle
          cd ../..
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/TELEVAULT.exe dist/TELEVAULT.exe -Force

      - name: Verify Release & Compute SHA-256 Checksums
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/verify_release.ps1 -SkipSmokeTest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: TELEVAULT ${{ github.ref_name || 'v2.1.3' }} — Windows Direct-Run
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/TELEVAULT.exe
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.txt
