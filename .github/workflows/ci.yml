name: TeleVault CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Windows Test Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Invariant Tests ("Constitution")
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/test_invariants.py -v

      - name: Run Full Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v

  linux-cli:
    name: Build & Test Linux CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux CLI (telecloud)
        run: |
          cargo build --release -p telecloud-cli

      - name: Run Rust Workspace Tests on Linux
        run: |
          cargo test --workspace --exclude telecloud-desktop

      - name: CLI Smoke Test
        run: |
          ./target/release/telecloud --help
          ./target/release/telecloud status

